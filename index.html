<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nitin Coco Duskmelt Dark Chocolate</title>
<meta name="description" content="Thank you for your likes and comments. The Nitin Coco website will be back soon.">
<meta name="robots" content="noindex">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500;600&display=swap">
<style>
  :root{--moon:#F3ECE1;--night:#1A100C;--night-2:#140B07;--couverture:#3A2117;--butter:#D8C8B2;--butter-2:#A8957F;--gold:#B8935A;--gold-2:#D9BC86;
    --serif:"Cormorant Garamond",Georgia,serif;--sans:"Manrope",system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{min-height:100svh;background:radial-gradient(120% 80% at 70% 40%,#2A1810 0%,var(--night) 55%,var(--night-2) 100%);
    color:var(--moon);font:400 17px/1.65 var(--sans);display:flex;flex-direction:column;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  .drip{position:fixed;inset:0 0 auto 0;height:120px;pointer-events:none;z-index:0}
  .drip svg{width:100%;height:100%;display:block}
  header{position:relative;z-index:2;padding:46px clamp(22px,6.6vw,96px) 0}
  .wordmark{font:500 15px var(--serif);letter-spacing:.42em;color:var(--moon);white-space:nowrap}
  .moon-i{display:inline-block;width:.8em;height:.8em;border-radius:50%;border:1.2px solid var(--gold);position:relative;vertical-align:-.08em;overflow:hidden;margin:0 .1em}
  .moon-i::after{content:"";position:absolute;inset:0 0 0 50%;background:var(--gold)}
  .sub{font:italic 400 15px var(--serif);color:var(--gold-2);margin-top:4px;letter-spacing:.02em}
  main{position:relative;z-index:2;flex:1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:center;
    gap:clamp(24px,5vw,80px);padding:clamp(40px,7vh,90px) clamp(22px,6.6vw,96px)}
  h1{font:400 clamp(46px,6.4vw,96px)/1.02 var(--serif);letter-spacing:-.01em;max-width:9.5em}
  .lead{margin-top:30px;max-width:30em;color:var(--butter);font-size:clamp(16px,1.25vw,19px)}
  .back{margin-top:34px;display:flex;align-items:center;gap:14px;color:var(--butter-2);font:500 14px var(--sans)}
  .back i{display:block;width:56px;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
  .piece{position:relative;justify-self:center;width:min(440px,80%);aspect-ratio:1}
  .piece img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 50px 50px rgba(0,0,0,.55));
    animation:float 7s ease-in-out infinite alternate}
  .piece::after{content:"";position:absolute;left:18%;right:18%;bottom:2%;height:9%;border-radius:50%;
    background:radial-gradient(closest-side,rgba(0,0,0,.6),transparent);animation:shadow 7s ease-in-out infinite alternate}
  @keyframes float{from{translate:0 -10px;rotate:-6deg}to{translate:0 14px;rotate:4deg}}
  @keyframes shadow{from{scale:.82;opacity:.55}to{scale:1;opacity:.9}}
  footer{position:relative;z-index:2;padding:0 clamp(22px,6.6vw,96px) 34px;color:var(--butter-2);font-size:13px}
  .rise{opacity:0;translate:0 18px;animation:rise 1.1s cubic-bezier(.2,.7,.2,1) forwards}
  .d2{animation-delay:.15s}.d3{animation-delay:.3s}.d4{animation-delay:.45s}
  @keyframes rise{to{opacity:1;translate:0 0}}
  @media (max-width:820px){
    main{grid-template-columns:1fr;padding-top:20px}
    .piece{order:-1;width:min(260px,62vw)}
    h1{font-size:clamp(42px,11vw,60px)}
    .lead{margin-top:22px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.rise{opacity:1;translate:none}}
</style>
</head>
<body>
  <div class="drip" aria-hidden="true">
    <svg viewBox="0 0 1440 120" preserveAspectRatio="none">
      <path fill="#3A2117" d="M0 0H1440V22C1400 22 1392 40 1380 58C1370 74 1350 74 1344 56C1336 34 1310 24 1270 26C1230 28 1222 50 1214 84C1208 108 1186 108 1182 82C1176 44 1150 28 1100 30C1050 32 1040 44 1032 60C1024 76 1004 76 998 58C990 34 960 26 900 28C850 30 842 48 836 70C830 92 808 92 804 70C798 40 770 26 720 26C670 26 650 36 642 54C634 72 614 72 608 52C600 30 570 24 520 26C470 28 462 54 456 92C452 114 430 114 426 90C420 50 396 30 350 30C300 30 290 42 282 58C274 74 254 74 248 56C240 32 210 24 160 26C110 28 100 46 94 66C88 86 66 86 62 64C56 34 30 22 0 22Z"/>
    </svg>
  </div>

  <header class="rise">
    <div class="wordmark">NITIN <span class="moon-i"></span> COCO</div>
    <div class="sub">Duskmelt Dark Chocolate</div>
  </header>

  <main>
    <div>
      <h1 class="rise d2">Thank you for your likes and comments.</h1>
      <p class="lead rise d3">We're making a few changes to the website. It will be back soon, better than before.</p>
      <p class="back rise d4"><i></i>See you again shortly</p>
    </div>
    <div class="piece rise d2" aria-hidden="true"><img src="./nc_piece_15.png" alt=""></div>
  </main>

  <footer>Designed and built by Nitin Chandra</footer>
</body>
</html>
